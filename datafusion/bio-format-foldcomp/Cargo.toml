[package]
name = "datafusion-bio-format-foldcomp"
version = "0.2.1"
description = "Protein foldcomp atom and residue table providers for DataFusion"
license = "Apache-2.0 AND MIT"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[dependencies]
datafusion.workspace = true
async-trait.workspace = true
futures.workspace = true
datafusion-bio-format-core = { path = "../bio-format-core", version = "1.13.1" }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
serde_json.workspace = true

[dependencies.datafusion-bio-format-structure]
path = "../bio-format-structure"
version = "0.2.1"
default-features = false

[features]
text-formats = ["datafusion-bio-format-structure/text-formats"]

[[example]]
name = "benchmark_structures"
required-features = ["text-formats"]
