[package]
name = "datafusion-bio-format-bgen"
version = "0.4.0"
description = "BGEN 1.2/1.3 genotype support for Apache DataFusion"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
readme = "README.md"

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
log.workspace = true
blake3 = "1.8"
bytes.workspace = true
datafusion.workspace = true
datafusion-bio-format-core = { path = "../bio-format-core" }
flate2.workspace = true
libdeflater.workspace = true
opendal.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { workspace = true, features = ["fs", "io-util"] }
zstd = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
futures.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "macros"] }

[[bench]]
name = "bgen_scan"
harness = false
