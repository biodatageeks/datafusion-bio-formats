name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: 'clippy, rustfmt'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      # The differential tests compare this crate's output against reference
      # implementations, and each skips itself when its oracle is absent. That
      # makes a green run without them indistinguishable from a green run with
      # them. CI installs all of them, verifies each responds, and sets the
      # REQUIRE_ flags so a missing oracle fails the run rather than skipping.
      - name: Install reference oracle tools
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: oracles
          create-args: >-
            python=3.11
            bioconda::bcftools
            bioconda::plink2
            bioconda::bgen-cpp
          init-shell: bash

      - name: Install reference oracle packages
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Pinned, so a reference upgrade cannot silently change what
          # "matches" means.
          python -m pip install -r datafusion/bio-format-pgen/benchmark/requirements-pgen-parity.txt
          # qctool has no conda package and no prebuilt binary, so it is the one
          # oracle CI cannot require; BGEN_REQUIRE_QCTOOL is left unset and that
          # comparison stays opt-in for anyone who has built it locally.
          # BGEN parity reads through both snputils and the bgen package.
          python -m pip install bgen
          # Every oracle is checked here rather than at test time: a missing one
          # must fail the install, not quietly turn a differential test into a
          # no-op.
          python -c "import numpy, pgenlib, snputils; from bgen import BgenReader"
          for tool in bcftools plink2 bgenix; do
            command -v "$tool" >/dev/null || { echo "missing oracle: $tool" >&2; exit 1; }
          done
          echo "PGEN_REFERENCE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "BGEN_REFERENCE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Run tests
        shell: bash -el {0}
        run: cargo test --all
        env:
          # An absent oracle fails the run instead of skipping itself.
          PGEN_REQUIRE_REFERENCE_ORACLES: "1"
          PGEN_REFERENCE_PLINK2: plink2
          PGEN_REQUIRE_PLINK2_ORACLE: "1"
          BGEN_REQUIRE_REFERENCE_ORACLES: "1"
          REQUIRE_BCFTOOLS: "1"

      - name: Build benchmark runner
        run: cargo build --package datafusion-bio-benchmarks-runner
