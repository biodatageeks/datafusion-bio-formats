name: Structure reader portability
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      performance_validation:
        description: "Run paired release measurements and Arrow diagnostics on Linux ARM64"
        type: boolean
        default: false
      consumer_validation:
        description: "Run isolated Rust candidate installed-wheel checks"
        type: boolean
        default: false
      fuzz_cpu_seconds:
        description: "CPU seconds per decoder shard (0 runs normal portability checks)"
        type: number
        default: 0
      fuzz_shards:
        description: "Sustained campaign shards per decoder (1-8)"
        type: number
        default: 8
permissions:
  contents: read
jobs:
  performance:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_validation
    uses: ./.github/workflows/structure-codecs-performance.yml
  consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_validation
    uses: ./.github/workflows/structure-codecs-consumer.yml
  rust-readers:
    if: github.event_name != 'workflow_dispatch' || (inputs.fuzz_cpu_seconds == 0 && !inputs.consumer_validation && !inputs.performance_validation)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pinned native reference commit
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # toolchain from rust-toolchain.toml
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build source-identical Rust candidate
        run: cargo build --locked --manifest-path testing/fuzz/structure-codecs/Cargo.toml --release --no-default-features --features probe --bin codec_probe
      - name: Verify stress fixtures against the host arithmetic profile
        env:
          CXX: ${{ runner.os == 'Windows' && 'cl' || 'c++' }}
        run: |
          python testing/oracles/structure-codecs/test_foldcomp_stress.py
          python testing/oracles/structure-codecs/foldcomp_stress.py --check
      - name: Compare Rust codecs with pinned external process
        shell: python
        env:
          CXX: ${{ runner.os == 'Windows' && 'cl' || 'c++' }}
        run: |
          import os
          import subprocess
          import sys
          probe = "testing/fuzz/structure-codecs/target/release/codec_probe"
          if os.name == "nt":
              probe += ".exe"
          subprocess.run([
              sys.executable, "testing/oracles/structure-codecs/compare_candidate.py",
              "--candidate", probe, "--output", "target/codec-platform-comparison.json",
              "--label", "${{ matrix.os }}",
          ], check=True)
      - name: Compare provider mapping with the external legacy process
        env:
          CXX: ${{ runner.os == 'Windows' && 'cl' || 'c++' }}
        run: python testing/oracles/structure-codecs/check_provider_reference.py
      - name: Retain platform observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codec-platform-${{ matrix.os }}
          path: target/codec-platform-comparison.json
      - run: cargo test -p datafusion-bio-format-structure -p datafusion-bio-format-foldcomp
      - run: cargo test -p datafusion-bio-format-structure --no-default-features
      - run: cargo test -p datafusion-bio-format-foldcomp
      - run: cargo test -p datafusion-bio-format-foldcomp --features text-formats
      - run: cargo test -p datafusion-bio-format-structure -p datafusion-bio-format-foldcomp --release --lib
      - run: cargo clippy -p datafusion-bio-format-structure -p datafusion-bio-format-foldcomp --all-targets --all-features -- -D warnings
  external-oracles:
    if: github.event_name != 'workflow_dispatch' || (inputs.fuzz_cpu_seconds == 0 && !inputs.consumer_validation && !inputs.performance_validation)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r testing/oracles/structure/requirements.txt
      - run: python testing/oracles/structure/generate.py --check

  rust-fuzz-smoke:
    if: github.event_name != 'workflow_dispatch' || (inputs.fuzz_cpu_seconds == 0 && !inputs.consumer_validation && !inputs.performance_validation)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [cif_document, fcz_decode, selected_range]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: testing/fuzz/structure-codecs
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: python testing/fuzz/structure-codecs/seed.py
      - run: python testing/fuzz/structure-codecs/run.py --toolchain nightly-2026-02-02 --seconds 60 --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-fuzz-${{ matrix.target }}
          path: |
            testing/fuzz/structure-codecs/logs
            testing/fuzz/structure-codecs/artifacts
            testing/fuzz/structure-codecs/corpus

  campaign-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz_cpu_seconds > 0
    runs-on: ubuntu-22.04
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - id: matrix
        shell: python
        env:
          CPU_BUDGET: ${{ inputs.fuzz_cpu_seconds }}
          SHARDS: ${{ inputs.fuzz_shards }}
        run: |
          import json, math, os
          seconds = float(os.environ["CPU_BUDGET"])
          shards = float(os.environ["SHARDS"])
          assert math.isfinite(seconds) and 0 < seconds <= 14400
          assert shards.is_integer() and 1 <= shards <= 8
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("shards=" + json.dumps(list(range(int(shards)))) + "\n")

  rust-fuzz-campaign:
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz_cpu_seconds > 0
    needs: campaign-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [cif_document, fcz_decode]
        shard: ${{ fromJSON(needs.campaign-matrix.outputs.shards) }}
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      SHARD: ${{ matrix.shard }}
      CPU_BUDGET: ${{ inputs.fuzz_cpu_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: testing/fuzz/structure-codecs
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build before measuring fuzzer CPU
        run: |
          cargo +nightly-2026-02-02 fuzz build --fuzz-dir testing/fuzz/structure-codecs "$FUZZ_TARGET"
          git diff --exit-code -- testing/fuzz/structure-codecs/Cargo.lock
      - run: python testing/fuzz/structure-codecs/seed.py
      - name: Run measured campaign shard
        run: python testing/fuzz/structure-codecs/campaign.py run --target "$FUZZ_TARGET" --shard "$SHARD" --cpu-seconds "$CPU_BUDGET" --output testing/fuzz/structure-codecs/logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-campaign-${{ matrix.target }}-${{ matrix.shard }}
          retention-days: 7
          path: |
            testing/fuzz/structure-codecs/logs
            testing/fuzz/structure-codecs/corpus/${{ matrix.target }}

  campaign-summary:
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz_cpu_seconds > 0
    needs: [campaign-matrix, rust-fuzz-campaign]
    runs-on: ubuntu-22.04
    env:
      CPU_BUDGET: ${{ inputs.fuzz_cpu_seconds }}
      SHARDS: ${{ inputs.fuzz_shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: codec-campaign-*
          path: target/codec-campaign
      - name: Require every shard and its measured CPU budget
        run: python testing/fuzz/structure-codecs/campaign.py summarize --directory target/codec-campaign --shards "$SHARDS" --cpu-seconds "$CPU_BUDGET" --revision "$GITHUB_SHA" --output target/codec-campaign-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: codec-campaign-summary
          path: target/codec-campaign-summary.json
